version: '3.8'

services:
  # ============================================================================
  # 1. PostgreSQL (PostGIS) Database Engine
  # ============================================================================
  postgres:
    image: postgis/postgis:16-3.4-alpine
    container_name: farmtrace_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-farmtrace_db}
      POSTGRES_USER: ${POSTGRES_USER:-farmtrace_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-farmtrace_secure_pass_2026}
      PGDATA: /var/lib/postgresql/data/pgdata
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      # مجلد تخزين بيانات قاعدة البيانات بشكل دائم (Persistent Volume)
      - postgres_data:/var/lib/postgresql/data
      # سكربت تهيئة قاعدة البيانات والتأكد من تفعيل ملحقات PostGIS و UUID
      - ./init-db.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-farmtrace_user} -d ${POSTGRES_DB:-farmtrace_db}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - farmtrace_network

  # ============================================================================
  # 2. Redis Cache & Anti-Fraud Scanner Rate Limiting
  # ============================================================================
  redis:
    image: redis:7-alpine
    container_name: farmtrace_redis
    restart: unless-stopped
    command: >
      redis-server 
      --appendonly yes 
      --requirepass ${REDIS_PASSWORD:-farmtrace_redis_secret_2026}
      --maxmemory 256mb
      --maxmemory-policy allkeys-lru
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      # مجلد الحفظ الدائم لبيانات Redis (AOF Persistence)
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-farmtrace_redis_secret_2026}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    networks:
      - farmtrace_network

  # ============================================================================
  # 3. Node.js / NestJS Backend Application (Development Mode with Hot-Reload)
  # ============================================================================
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.dev
    container_name: farmtrace_backend_dev
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      NODE_ENV: development
      PORT: 3000
      # الاتصال بالخدمات عبر أسماء الحاويات الداخلية (DNS resolution داخل Docker network)
      DATABASE_URL: postgresql://${POSTGRES_USER:-farmtrace_user}:${POSTGRES_PASSWORD:-farmtrace_secure_pass_2026}@postgres:5432/${POSTGRES_DB:-farmtrace_db}?schema=public
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:-farmtrace_redis_secret_2026}
      TRACE_HMAC_SECRET_KEY: ${TRACE_HMAC_SECRET_KEY:-farmtrace-dev-hmac-master-key-32bytes-secret}
      FRONTEND_URL: http://localhost:3000
    ports:
      - "3000:3000"  # منفذ خادم التطبيق
      - "9229:9229"  # منفذ فحص وتتبع الأخطاء البرمجية (Node.js V8 Debugger / Inspector)
    volumes:
      # مجلد مشترك لمزامنة الأكواد لحظياً (Hot-Reloading / Live Sync)
      - ./backend:/usr/src/app
      # مجلد مجهول لعزل حزم node_modules الخاصة بالحاوية ومنع تضاربها مع نظام تشغيل المضيف
      - /usr/src/app/node_modules
    command: npm run start:dev
    stdin_open: true
    tty: true
    networks:
      - farmtrace_network

# ============================================================================
# Persistent Storage Volumes (المجلدات التخزينية المشتركة)
# ============================================================================
volumes:
  postgres_data:
    name: farmtrace_postgres_data
    driver: local
  redis_data:
    name: farmtrace_redis_data
    driver: local

# ============================================================================
# Networks (الشبكة الداخلية الآمنة للتواصل بين الحاويات)
# ============================================================================
networks:
  farmtrace_network:
    name: farmtrace_internal_net
    driver: bridge
